name: Android APK

on:
  workflow_dispatch:
  workflow_call: # the release workflow builds the APK through this
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4 # the Capacitor CLI needs Node 22+
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the SDK; Gradle fetches the platform it needs once licenses are accepted.
      - run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null
      - run: npm ci
      - run: npm run web
      # The android/ project is generated, not committed.
      - run: npx cap add android && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk lgd-android.apk
      # ponytail: debug-signed (installs fine, just not Play Store material)
      - uses: actions/upload-artifact@v4
        with:
          name: lgd-android.apk
          path: lgd-android.apk
