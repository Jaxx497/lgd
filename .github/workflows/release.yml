name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub release (off = dry run: build everything, publish nothing)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: libgen-dl-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: libgen-dl-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            artifact: libgen-dl-macos-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: libgen-dl-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: libgen-dl-windows-x64.exe
          - os: windows-11-arm
            target: bun-windows-arm64
            artifact: libgen-dl-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # a dry run has no tag yet: build the current commit
          ref: ${{ inputs.publish && inputs.tag || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bun is used only here, to compile the standalone executables.
      - name: Install dependencies
        run: npm ci

      - name: Compile executable
        run: bun build src/index.ts --compile --outfile ${{ matrix.artifact }}

      - name: Sign macOS executable
        if: startsWith(matrix.os, 'macos')
        run: codesign --sign - --force --preserve-metadata=entitlements,requirements,flags,runtime ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  apk:
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ inputs.publish && inputs.tag || '' }}

  release:
    if: inputs.publish
    needs: [build, apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## libgen-dl ${{ inputs.tag }}

            **Terminal:** download the executable for your platform and make it executable
            (`chmod +x libgen-dl-*`), or install with npm (see the README).

            **Android:** download `LibgenDL.apk` and open it on your phone.
